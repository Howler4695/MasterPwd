[package]
name = "mpw-cli"
description = "Command-line Master Password client, compatible with the reference `mpw` tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mpw"
path = "src/main.rs"

[dependencies]
mpw-core = { path = "../mpw-core" }
# mpw-model is wired in a later round (user files: -f/-F/-R, ~/.mpw.d); see src/store.rs.
rpassword = "7"
zeroize = "1"
