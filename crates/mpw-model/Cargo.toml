[package]
name = "mpw-model"
description = "Master Password users, sites and questions, with the mpsites/mpjson export formats and on-disk storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mpw-core = { path = "../mpw-core" }
# Unknown JSON members must survive a load/save round trip in their original order.
serde_json = { version = "1", features = ["preserve_order"] }
zeroize = "1"
thiserror = "2"
