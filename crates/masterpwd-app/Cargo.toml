[package]
name = "masterpwd-app"
description = "Master Password for macOS: a native menu-bar app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "masterpwd_app"
path = "src/lib.rs"

[[bin]]
name = "MasterPwd"
path = "src/main.rs"

[dependencies]
mpw-core = { path = "../mpw-core" }
mpw-model = { path = "../mpw-model" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "LAContext",
    "LAError",
] }
security-framework = { version = "3", features = ["OSX_10_15"] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSIndexSet",
    "NSNotification",
    "NSRange",
    "NSObject",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSAccessibilityProtocols",
    "NSAlert",
    "NSClipView",
    "NSFontDescriptor",
    "NSImageCell",
    "NSImageView",
    "NSOpenPanel",
    "NSPanel",
    "NSParagraphStyle",
    "NSSavePanel",
    "NSScreen",
    "NSScrollView",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableView",
    "NSUserInterfaceItemIdentification",
    "NSApplication",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSPopUpButton",
    "NSProgressIndicator",
    "NSResponder",
    "NSRunningApplication",
    "NSSecureTextField",
    "NSSegmentedControl",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStepper",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
